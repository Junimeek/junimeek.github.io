    <body class="saya-lower-bg">
        <nav class="saya-navbar saya-navbar-font-scene">
            <div class="saya-navbar-container">
                <script src="../../resources/sayaka/sayaka-navbar-loader.js" onload="LoadNavBar(1)"></script>
            </div>
        </nav>

        <div class="saya-body">
            <noscript>
                <p class="saya-short-paragraph">
                    <b style="color: red;">JavaScript is disabled in your browser settings. JavaScript must be enabled for this page to function properly.</b>
                </p>
                <hr>
            </noscript>

            <h2 class="saya-h2">Interactive map</h2>
            <p class="saya-paragraph">
                The map below is interactable and can be used to view the entire system at once. To open the map in a new tab, simply click the "fullscreen" button in the top right corner of the embedded map.
            </p>

            <div id="map" class="saya-sf-centered"></div>
            <script>
                const map = L.map('map').setView([29.4285531, -98.4904232], 15);

                const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
	            maxZoom: 19,
	            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
                }).addTo(map);
            </script>
        </div>
    </body>
